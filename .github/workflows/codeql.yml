name: CodeQL

# ─────────────────────────────────────────────────────────────────────────────
#  Static analysis. REPO-BASELINE.md §1: "Static analysis exists only when a
#  human remembers to run it."
#
#  Why this arrives in Phase 2 and not Phase 0: there was no code to analyse, and
#  a CodeQL C# job on a repository with no solution fails at the autobuild step.
#  A permanently red required check trains everyone to ignore red checks, which
#  costs more than the analysis buys.
#
#  Why the visibility guard: GitHub code scanning needs Advanced Security on a
#  private repository. This one is private today and public shortly. Rather than
#  ship a workflow that fails for a reason unrelated to the code — the same
#  objection as above — the job skips itself while the repository is private and
#  starts working, with no edit, the moment it is not.
#
#  That guard is a dated compromise, not a preference: see docs/DEVIATIONS.md D-1.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'claude/**']
  schedule:
    # Mondays 04:00 UTC. Rule sets change under a codebase that has not.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Is code scanning available here?
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "## CodeQL: SKIPPED"
              echo
              echo "This repository is private, and code scanning requires GitHub Advanced"
              echo "Security on a private repository. The workflow is committed and reviewed;"
              echo "it starts analysing on the first push after the repository becomes public,"
              echo "with no change to this file."
              echo
              echo "Tracked as D-1 in \`docs/DEVIATIONS.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::CodeQL skipped — private repository without Advanced Security."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        if: steps.gate.outputs.available == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-and-quality

      - uses: actions/setup-dotnet@v6
        if: steps.gate.outputs.available == 'true'
        with:
          global-json-file: global.json

      - name: Build for analysis
        if: steps.gate.outputs.available == 'true'
        # CodeQL needs a real build. Analysis of a project that did not compile is
        # analysis of nothing, reported as a pass.
        run: dotnet build --configuration Release

      - name: Perform CodeQL analysis
        if: steps.gate.outputs.available == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:csharp
