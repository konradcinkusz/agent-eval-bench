name: Secret Scan

# ─────────────────────────────────────────────────────────────────────────────
#  Secret scanning — the CI half of a two-part control.
#
#      developer machine                    GitHub
#      ┌──────────────────────┐             ┌──────────────────────────┐
#      │ scripts/hooks/       │             │ this workflow            │
#      │   pre-commit         │             │   • full git history     │
#      │   • staged changes   │  ────────▶  │   • every PR and push    │
#      │   • blocks the commit│             │   • weekly, on schedule  │
#      └──────────────────────┘             └──────────────────────────┘
#        catches the mistake                  catches contributors
#        before it is history                 without hooks
#
#  P5 makes this mandatory: "a repository without one is assumed to contain
#  credentials until proven otherwise". REPO-BASELINE.md §2 explains why both
#  halves exist rather than either alone.
#
#  Why the scanner image is :latest — deliberately, against the usual pinning
#  rule. A detection ruleset is only worth what its newest rule catches, and a
#  pinned scanner silently stops detecting whatever was added upstream last
#  month. The trade (a scanner that can change under us) buys detection that
#  does not decay. Everything else in this repository is pinned.
#
#  The weekly run exists because rules are added upstream continuously: a commit
#  that was clean in March can be a finding in June, and nobody re-scans history
#  on their own initiative.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'claude/**']
  schedule:
    # Mondays 05:30 UTC — before the Dependabot batch, so a rule-set change that
    # turns an old commit into a finding is not confused with a dependency bump.
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 is load-bearing. The default shallow clone would scan
          # only the tip commit, so a secret added and then removed in an earlier
          # commit of the same branch would pass — which is precisely the case
          # this job exists to catch, since the secret is still in history.
          fetch-depth: 0

      - name: Scan
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/gitleaks/gitleaks:latest"

          # gitleaks renamed `detect` to `git` in v8.19 and kept the old name as a
          # deprecated alias. Probe instead of assuming, so a scanner upgrade does
          # not turn this job red for the wrong reason.
          if docker run --rm "$IMAGE" git --help >/dev/null 2>&1; then
            SUB=(git /repo)
          else
            SUB=(detect --source=/repo)
          fi

          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            "$IMAGE" \
            "${SUB[@]}" \
              --config=/repo/.gitleaks.toml \
              --redact \
              --no-banner \
              --verbose \
              --exit-code 1

      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "## Secret scan failed"
            echo
            echo "A credential-shaped string was found in this repository's history."
            echo
            echo "**This repository is public.** A pushed commit is disclosed the moment"
            echo "it is pushed, so the order of operations is not negotiable:"
            echo
            echo "1. **Rotate the credential.** Now, before anything else."
            echo "2. Remove it from the source; read it from the environment instead"
            echo "   (see \`secrets.env.example\` for the documented variable set)."
            echo "3. Only then clean history."
            echo
            echo "Scrubbing without rotating is theatre — REPO-BASELINE.md §2."
            echo
            echo "If this is a false positive, add a **narrow** allowlist entry to"
            echo "\`.gitleaks.toml\` with a comment saying why. Never allowlist a finding"
            echo "by pasting the real value into a regex."
            echo
            echo "Reproduce locally: \`./scripts/scan-secrets.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"
