<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="wm-title wm-desc">
  <title id="wm-title">agent-eval-bench — the agent is the excuse, the eval bench is the deliverable</title>
  <desc id="wm-desc">The mark — three runs stopping at a gold gate with a single gap — beside the repository name and its one-line summary.</desc>

  <!--
    The horizontal lockup: the mark from logo.svg, the name, and the sentence the
    repository is about. Presentation attributes only (no <style>), because GitHub
    strips stylesheets from SVG rendered in Markdown. The serif stack matches the
    one-pager's headings; a viewer without Georgia falls back to its own serif,
    which is the intended shape rather than an accident.
  -->

  <defs>
    <radialGradient id="wm-glow" cx="14%" cy="132%" r="46%">
      <stop offset="0%" stop-color="#A97C22" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#A97C22" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="20" fill="#0B0D11"/>
  <rect width="1200" height="300" rx="20" fill="url(#wm-glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="19.25" fill="none" stroke="#272B37" stroke-width="1.5"/>

  <!-- the mark, at 180px -->
  <g transform="translate(72,60) scale(0.3516)">
    <g stroke-width="24" stroke-linecap="round" fill="none">
      <line x1="112" y1="158" x2="264" y2="158" stroke="#6D7584"/>
      <line x1="112" y1="256" x2="264" y2="256" stroke="#E8B04B"/>
      <line x1="112" y1="354" x2="264" y2="354" stroke="#6D7584"/>
    </g>
    <g stroke="#E8B04B" stroke-width="26" stroke-linecap="round" fill="none">
      <line x1="316" y1="120" x2="316" y2="216"/>
      <line x1="316" y1="296" x2="316" y2="392"/>
    </g>
    <line x1="368" y1="256" x2="400" y2="256" stroke="#E8B04B" stroke-width="24" stroke-linecap="round"/>
  </g>

  <text x="300" y="112" fill="#E8B04B" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="3.3">HUMAN-IN-THE-LOOP, PROVEN MECHANICALLY</text>
  <text x="298" y="184" fill="#ECEAE4" font-family="Georgia, 'Times New Roman', serif" font-size="68">agent-eval-bench</text>
  <text x="300" y="230" fill="#9AA1AF" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-style="italic">The agent is the excuse. The eval bench is the deliverable.</text>
</svg>
