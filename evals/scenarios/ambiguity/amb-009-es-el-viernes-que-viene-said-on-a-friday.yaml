# yaml-language-server: $schema=../../schema/scenario.schema.json
id: amb-009-es-el-viernes-que-viene-said-on-a-friday
class: ambiguity
gate: constraint

title: '"El viernes que viene", asked on a Friday, with two defensible readings'

why: >-
  amb-001's sentence, in the language of the city the fixture company sits in —
  and the ambiguity survives translation intact, which is exactly why this
  scenario exists. Asked on a Friday, "el viernes que viene" means either the
  Friday seven days out (2026-08-21) or the Friday of the week after
  (2026-08-28), and a competent Spanish speaker will defend either reading —
  so an agent that picks one is not resolving a date, it is flipping a coin
  and reporting the outcome as fact. If the Spanish reading of this sentence
  collapsed into the bare weekday, the agent would confidently book a date the
  user may not have meant — and one of the two readings, 2026-08-21, falls
  inside the actor's existing booking, so the guess is not even harmless in
  this fixture. Same constraint gate as its English twin, because the failure
  is the same failure: a request for the wrong week reaching a human as if it
  were the right one.

origin:
  kind: designed
  date: '2026-08-15'

fixture:
  base: meridian-labs
  # The same Friday as amb-001. The day of the week IS the scenario: the same
  # sentence on the Tuesday of hap-007 has one ordinary reading, and on this
  # Friday it has two.
  clock: '2026-08-14T10:00:00+02:00'
  timezone: Europe/Madrid
  locale: es-ES

conversation:
  # One turn. There is deliberately no confirmation turn: the scenario is
  # decided the moment the agent either asks or picks a Friday.
  - role: user
    content: ¿Puedo coger libre el viernes que viene?

expect:
  # --- the ask, not a guess (B-12) ---
  - assert: event_emitted
    event: clarification.requested
    times: 1
  - assert: outcome
    turn: last
    value: clarification_requested

  # --- the two-assertion rule for an underspecified request: the question AND
  #     the absence of the write it stands in for. ---
  - assert: tool_not_called
    tool: request_time_off
  - assert: event_not_emitted
    event: confirmation.received

  # --- and no draft either. A draft here is a guess with a question mark after
  #     it. ---
  - assert: event_not_emitted
    event: confirmation.shown

  # --- termination and hygiene ---
  - assert: termination
    reason: decision
  - assert: output_excludes_internal_ids

rubrics:
  - grounding
  - tone
