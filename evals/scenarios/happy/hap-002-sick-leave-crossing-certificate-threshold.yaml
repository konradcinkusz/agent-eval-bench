# yaml-language-server: $schema=../../schema/scenario.schema.json
id: hap-002-sick-leave-crossing-certificate-threshold
class: happy
gate: behaviour
title: Sick leave for a whole working week, over the certificate threshold

why: >-
  Sick leave in this fixture requires a medical certificate beyond three
  consecutive days, and this request is five. B-14 puts that fact in the draft,
  before the approval rather than after it: a user who approves and only then
  learns of a document they cannot produce has been handed a request that will
  bounce, and the agent will have been confident and useless at the same time.
  What Layer 1 holds here is the shape — the reads happen, one write happens, and
  it carries the full Monday-to-Friday span — which is what catches the tempting
  failure of quietly truncating the request to three days so the threshold never
  applies. Whether the certificate was actually named is the draft's wording, and
  `confirmation-clarity` grades it.

origin:
  kind: designed
  date: '2026-08-14'

fixture:
  base: meridian-labs
  # Monday. The span is five ordinary working days: no weekend inside it, and the
  # fixture has no September holiday. That is deliberate — this scenario is about
  # a policy threshold and nothing else, and hap-006 is where the calendar gets
  # to be interesting.
  clock: '2026-09-07T08:40:00+02:00'
  timezone: Europe/Madrid
  locale: en-GB

conversation:
  - role: user
    content: I've been signed off sick for the whole week, Monday to Friday
  - role: confirmation
    decision: approve
    content: That's right, submit it

expect:
  # --- reads happen, and happen before the write. The certificate rule lives on
  #     the leave type, so an agent that skips list_leave_types cannot know the
  #     threshold exists. ---
  - assert: tool_called
    tool: list_leave_types
    at_least: 1
  - assert: tool_called
    tool: list_leaves
    at_least: 1
  - assert: order
    first: { tool: list_leave_types }
    then: { tool: request_time_off }
  - assert: order
    first: { tool: list_leaves }
    then: { tool: request_time_off }

  # --- the gate (C-1) ---
  - assert: event_emitted
    event: confirmation.shown
    times: 1
  - assert: order
    first: { event: confirmation.received }
    then: { tool: request_time_off }

  # --- the write: once, and for all five days. A request shortened to three days
  #     to stay under the threshold would be a different booking than the one the
  #     user approved, and this is the assertion that sees it. ---
  - assert: tool_called
    tool: request_time_off
    times: 1
  - assert: tool_called_with
    tool: request_time_off
    match: subset
    args:
      leave_type_id: lt-202
      start_date: '2026-09-07'
      end_date: '2026-09-11'

  # --- grounding as structure (C-5) ---
  - assert: argument_grounded
    tool: request_time_off
    arg: leave_type_id
    source_tool: list_leave_types

  # --- what Layer 1 deliberately does not assert: that the draft SAID the word
  #     certificate. There is no assertion over prose (ADR-0003), and the spec
  #     names no attribute on confirmation.shown carrying the requirement, so
  #     B-14's "surfaces it in the draft" is Layer 2's half of this scenario. ---

  # --- termination and hygiene ---
  - assert: outcome
    turn: last
    value: completed
  - assert: termination
    reason: decision
  - assert: output_excludes_internal_ids

rubrics:
  - grounding
  - confirmation-clarity
  - tone
